<!-- index.html -->
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Loja Online - Checkout</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 400px; margin: auto; border: 1px solid #ccc; padding: 20px; border-radius: 8px; }
        input { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #28a745; color: white; border: none; cursor: pointer; }
        h2 { text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <h2>Finalizar Compra</h2>
    <form action="processar_pagamento.php" method="POST">
        <label>Nome no Cartão</label>
        <input type="text" name="card_holder" placeholder="Ex: João Silva" required>

        <label>Número do Cartão</label>
        <input type="text" name="card_number" placeholder="0000 0000 0000 0000" required>

        <label>Data de Validade (MM/AA)</label>
        <input type="text" name="expiry_date" placeholder="12/25" required>

        <label>CVV</label>
        <input type="text" name="cvv" placeholder="123" required>

        <label>Valor da Compra ($)</label>
        <input type="number" step="0.01" name="amount" placeholder="99.90" required>

        <button type="submit">Confirmar Pagamento</button>
    </form>
</div>

</body>
</html>
